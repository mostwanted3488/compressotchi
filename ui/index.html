<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMPRESSOTCHI</title>
<style>
  :root{ --lcd-bg:#c6d696; --ink:#202a16; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#070707;color:#d8d8d8;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse at 50% 40%,#1b1b1b 0%,#0a0a0a 55%,#040404 100%)}
  .title{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#6d6d6d}
  .title b{color:#b8ff3c;font-weight:600}
  #wrap{position:relative;margin-bottom:4px}
  #stage{position:absolute;left:0;top:0;width:1304px;height:1206px;transform-origin:0 0}
  #egg{position:absolute;inset:0;transform-origin:50% 85%;
    filter:drop-shadow(0 40px 50px rgba(0,0,0,.85))}
  @keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
  #egg img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}

  /* écran LCD, déformé en perspective sur la zone verte */
  #screen{position:absolute;left:0;top:0;width:512px;height:512px;transform-origin:0 0;
    background:var(--lcd-bg);border-radius:46px;overflow:hidden}
  #lcd{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
  #grid{position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(to right,rgba(20,30,10,.13) 1px,transparent 1px),
                     linear-gradient(to bottom,rgba(20,30,10,.13) 1px,transparent 1px);
    background-size:8px 8px}
  #glare{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%),
               radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(10,20,0,.38) 100%);
    box-shadow:inset 0 0 26px rgba(0,0,0,.5)}
  #night{position:absolute;inset:0;pointer-events:none;background:#0b1a2e;opacity:0;mix-blend-mode:multiply}

  /* boutons */
  .btn{position:absolute;width:122px;height:122px;margin:-61px 0 0 -61px;border-radius:50%;cursor:pointer;
    -webkit-tap-highlight-color:transparent;outline:none}
  .btn i{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 100%);
    transition:transform .08s,box-shadow .25s,background .08s}
  .btn.down i{transform:scale(.9) translateY(3px);
    background:radial-gradient(circle at 50% 40%,#000 0%,#000 70%,rgba(0,0,0,.6) 100%);
    box-shadow:inset 0 6px 14px rgba(0,0,0,.95),0 0 0 4px var(--c),0 0 38px 8px var(--c)}
  .btn.flash i{box-shadow:0 0 0 3px var(--c),0 0 46px 10px var(--c)}
  .btn em{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-style:normal;font-weight:700;
    font-size:26px;letter-spacing:.1em;color:rgba(40,40,40,.55);text-shadow:0 1px 0 rgba(255,255,255,.55);pointer-events:none}

  .legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid #2c2c2c;border-radius:999px;
    background:#101010;color:#bbb;font-size:12px;letter-spacing:.12em;cursor:pointer;user-select:none;transition:.15s}
  .chip b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#000;font-size:12px}
  .chip{position:relative;overflow:hidden}.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--c);opacity:.28;transition:width .08s}.chip>*{position:relative}
  #cap{min-height:26px;font-size:15px;font-weight:700;letter-spacing:.12em;color:#8a8a8a;text-align:center;transition:color .2s}
  .chip:hover,.chip.on{border-color:var(--c);color:#fff;box-shadow:0 0 18px -4px var(--c)}
  .audio{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #status{font-size:11px;letter-spacing:.14em;color:#7a7a7a;text-align:center;min-height:16px}
  #status b{color:#b8ff3c}
  .hint{font-size:11px;color:#5f5f5f;letter-spacing:.08em;text-align:center;max-width:620px;line-height:1.6;padding:0 12px}
  .knobs{display:flex;gap:26px;align-items:flex-end;justify-content:center;margin-top:2px}
  .knob{width:66px;text-align:center;cursor:ns-resize;user-select:none;touch-action:none;position:relative}
  .knob svg{width:100%;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.7))}
  .knob .g{transform-origin:32px 32px}
  .knob .lab{display:block;margin-top:4px;font-size:9px;letter-spacing:.22em;color:#6b6b6b}
  .knob .val{position:absolute;left:0;right:0;top:-16px;font-size:10px;color:#b8ff3c;opacity:0;transition:opacity .15s;white-space:nowrap}
  .knob.drag .val,.knob:hover .val{opacity:1}
  .knob.small{width:44px;opacity:.5;transition:opacity .2s}.knob.small:hover,.knob.small.drag{opacity:1}
  .corner{position:fixed;left:12px;bottom:10px;display:flex;gap:10px;align-items:center;font-size:10px;letter-spacing:.14em;color:#4d4d4d}
  .corner label,.corner span.pp{cursor:pointer;padding:5px 9px;border:1px solid #232323;border-radius:999px;transition:.15s}
  .corner label:hover,.corner span.pp:hover{color:#b8ff3c;border-color:#3a3a3a}
  .rack{display:flex;gap:22px;align-items:flex-start;justify-content:center;margin-top:2px}
  .rack .knobs{margin:0;gap:22px}
  .grp{width:40px;text-align:center}
  .grp .sel{display:flex;flex-direction:column;gap:3px;height:62px;margin-top:2px}
  .grp .lab{display:block;margin-top:8px;font-size:9px;letter-spacing:.22em;color:#6b6b6b}
  .sb{height:14px;line-height:13px;font-size:9px;color:#666;background:#101010;border:1px solid #2a2a2a;border-radius:2px;cursor:pointer;user-select:none;transition:.12s}
  .sb:hover{color:#aaa}
  .sb.tall{height:62px;line-height:60px;font-size:11px}
  .sb.on{color:#b8ff3c;border-color:#b8ff3c;background:#192206;box-shadow:0 0 8px rgba(184,255,60,.3)}
  .btn{cursor:pointer}
  .credit{position:fixed;right:14px;bottom:10px;font-size:10px;letter-spacing:.16em;color:#3a3a3a;user-select:none}
  .knob svg{filter:none}
  .cap{position:absolute;left:calc(50% - 23px);top:10px;width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,#f4f6f7 0%,#7d848a 38%,#3d4247 55%,#c9ced2 100%);box-shadow:0 6px 9px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.6)}
  .cap::before{content:'';position:absolute;inset:3px;border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.07) 1px 2px),
      conic-gradient(from 20deg,#8d949a,#eef1f3,#5f656b,#dde1e4,#7c838a,#f6f8f9,#555b61,#cfd4d8,#8d949a);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  .ind{position:absolute;inset:0;pointer-events:none}
  .ind::before{content:'';position:absolute;left:50%;top:7%;width:3px;height:27%;margin-left:-1.5px;background:#15181b;border-radius:2px;box-shadow:0 0 0 .6px rgba(255,255,255,.4)}
  .btn.down i,.btn.flash i{box-shadow:none!important;background:none!important}
  .btn:active i{transform:scale(.93);background:rgba(0,0,0,.22)}
  #hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .sb{color:#1b1e21;font-weight:700;border:0;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.06) 1px 2px),linear-gradient(180deg,#eef1f3 0%,#a9afb4 48%,#7b8288 52%,#c4c9cd 100%);box-shadow:0 3px 5px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.7);text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .sb:hover{color:#000;filter:brightness(1.06)}
  .sb.on{color:#e9ecee;text-shadow:0 0 6px rgba(255,255,255,.35);border:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,rgba(0,0,0,.08) 1px 2px),linear-gradient(180deg,#2a2e32,#4a5056 55%,#3a3f44);box-shadow:inset 0 3px 6px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.12)}
  .sb{position:relative}
  .sb.on::after{content:'';position:absolute;left:50%;margin-left:-7px;bottom:1px;width:14px;height:2px;border-radius:1px;background:#ff3a2a;box-shadow:0 0 5px #ff3a2a}
  .sb.tall.on::after{bottom:8px}
  body.host .corner{display:none}
  .rack{gap:26px}.rack .knobs{gap:20px}
  .knob{width:98px}
  .knob .lab{margin-top:0;font-size:10px}
  .knob .val{top:-12px}
  .cap{left:calc(50% - 27px);top:22px;width:54px;height:54px}
  .cap::before{inset:4px}
  .ind::before{width:3.5px;margin-left:-1.75px}
  .grp{width:46px}
  .grp .sel{height:90px;gap:4px}
  .sb{height:20px;line-height:19px;font-size:11px}
  .sb.tall{height:66px;line-height:64px;font-size:12px}
  .grp .lab{margin-top:12px}
  .lamp{width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:radial-gradient(circle at 35% 30%,#ffb0a0,#e4281c 45%,#6b0c08);box-shadow:0 0 10px 3px rgba(255,40,20,.7),inset 0 0 3px rgba(0,0,0,.4);transition:.15s}
  .lamp.off{background:radial-gradient(circle at 35% 30%,#5a2a28,#2a0e0c 60%,#140605);box-shadow:inset 0 0 3px rgba(0,0,0,.6)}
</style>
</head>

function quadMatrix(w,h,p){

}

    for(let k=0;k+1<xs.length;k+=2)for(let x=Math.ceil(xs[k]);x<=Math.floor(xs[k+1]);x++)set(x,y,v);

}

  for(let i=0;i<nT;i++){
    const a=(-135+270*i/(nT-1))*Math.PI/180,sn=Math.sin(a),cs=Math.cos(a);
    tk+=`<circle cx="${(32+28.5*sn).toFixed(1)}" cy="${(32-28.5*cs).toFixed(1)}" r="1.3" fill="#9a9a9a"/>`;
    tk+=`<text x="${(32+37.5*sn).toFixed(1)}" y="${(32-37.5*cs+2.2).toFixed(1)}" text-anchor="middle" font-size="7" font-family="Courier New,monospace" font-weight="700" fill="#8c8c8c">${k.scale[i]}</text>`;
    if(i<nT-1){const b=(-135+270*(i+.5)/(nT-1))*Math.PI/180;tk+=`<circle cx="${(32+28.5*Math.sin(b)).toFixed(1)}" cy="${(32-28.5*Math.cos(b)).toFixed(1)}" r=".7" fill="#666"/>`}
  }
  d.innerHTML=`<span class="val"></span><svg viewBox="-12 -10 88 88">${tk}</svg><div class="cap"><div class="ind"></div></div><span class="lab">${k.lab}</span>`;
  kbox.appendChild(d); k.g=d.querySelector('.ind'); k.val=d.querySelector('.val');
  const paint=()=>{k.g.style.transform=`rotate(${-135+k.v*270}deg)`;k.val.textContent=k.fmt(k.v)}; k.paint=paint; paint();
  let y0=0,v0=0;
  d.addEventListener('pointerdown',e=>{e.preventDefault();d.setPointerCapture(e.pointerId);y0=e.clientY;v0=k.v;d.classList.add('drag')});
  d.addEventListener('pointermove',e=>{if(!d.classList.contains('drag'))return;k.v=Math.max(0,Math.min(1,v0+(y0-e.clientY)/(e.shiftKey?600:180)));paint()});
  d.addEventListener('pointerup',()=>d.classList.remove('drag'));
  d.addEventListener('dblclick',()=>{k.v=k.d;paint()});
  d.addEventListener('wheel',e=>{e.preventDefault();k.v=Math.max(0,Math.min(1,k.v-Math.sign(e.deltaY)*.03));paint()},{passive:false});
});

/* ---------- RATIO (4 / 8 / 12 / 20) et METER (GR / +8 / +4 / OFF) : boutons à un seul choix ---------- */
function radio(id,labels,def,cb){
  const box=document.getElementById(id),bs=[]; box._bs=bs;
  labels.forEach((l,i)=>{const b=document.createElement('div');b.className='sb';b.textContent=l;box.appendChild(b);bs.push(b);
    b.addEventListener('pointerdown',e=>{e.preventDefault();bs.forEach((x,j)=>x.classList.toggle('on',j===i));cb(i)})});
  bs[def].classList.add('on'); cb(def);
}
let RI=3;
radio('ratio',['20','12','8','4'],SAVE.ratio!=null?SAVE.ratio:3,i=>{RI=i;AU.ratio=[20,12,8,4][i]});
radio('meter',['GR','+8','+4','OFF'],SAVE.meter!=null?SAVE.meter:0,i=>{S.meter=i});
/* bouton IN : allumé = compresseur dans le circuit, éteint = bypass */
(()=>{const b=document.createElement('div');b.className='sb tall';b.textContent='IN';document.getElementById('inb').appendChild(b);
  const lamp=document.getElementById('lamp'); const paint=()=>{b.classList.toggle('on',!AU.byp);lamp.classList.toggle('off',AU.byp)}; paint(); window.hostSetByp=v=>{AU.byp=v;paint()};
  b.addEventListener('pointerdown',e=>{e.preventDefault();AU.byp=!AU.byp;paint()});
  addEventListener('keydown',e=>{if(e.repeat)return;if(e.key.toLowerCase()==='i'){AU.byp=!AU.byp;paint()}});})();

/* ---------- les 3 boutons de l'œuf : A = thème d'écran, B = personnage, C = décor ---------- */
const THEMES=[{n:'GREEN',bg:[198,214,150],ink:[30,40,20],gh:[128,144,92]},{n:'AMBER',bg:[238,192,96],ink:[64,32,0],gh:[190,140,70]},
              {n:'BLUE',bg:[132,196,238],ink:[6,26,66],gh:[80,140,190]},{n:'BLACK',bg:[22,28,20],ink:[160,255,120],gh:[60,100,50]}];
const FORMS=['ANGEL','BLOB','CAT','GHOST','ROBOT'], DECORS=['NONE','STARS','RAIN','GROUND'];
function setTheme(i){const t=THEMES[i];for(let k=0;k<3;k++){BG[k]=t.bg[k];INK[k]=t.ink[k];GH[k]=t.gh[k]}}
function toast(){}   // pas d'étiquette : le changement se voit directement
const btns=[...document.querySelectorAll('.btn')];
function hit(i){
  if(i===0){S.theme=(S.theme+1)%THEMES.length;setTheme(S.theme);toast(THEMES[S.theme].n)}
  else if(i===1){S.form=S.form%4+1;toast(FORMS[S.form])}
  else {S.decor=(S.decor+1)%DECORS.length;toast(DECORS[S.decor])}
}
btns.forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();hit(+b.dataset.i)}));
addEventListener('keydown',e=>{ if(e.repeat)return; const k={a:0,b:1,c:2}[e.key.toLowerCase()]; if(k!==undefined)hit(k) });

/* ---------- mémoire des réglages (localStorage, facultatif) ---------- */
if(SAVE.theme!=null){S.theme=SAVE.theme|0;setTheme(S.theme)} if(SAVE.form>=1&&SAVE.form<=4&&SAVE.fv===2)S.form=SAVE.form|0; if(SAVE.decor!=null)S.decor=SAVE.decor|0;
let lastSave='';
setInterval(()=>{
  const j=JSON.stringify({input:K.input.v,output:K.output.v,attack:K.attack.v,release:K.release.v,ratio:RI,meter:S.meter,theme:S.theme,form:S.form,fv:2,decor:S.decor,byp:AU.byp});
  if(j!==lastSave){lastSave=j; if(HOST)emit('ui',{json:j}); else{try{localStorage.setItem('sg_comp_v1',j)}catch(e){}}}
},600);

function fitRack(){
  const r=document.querySelector('.rack'); r.style.transform='none';
  const nat=document.getElementById('knobs').offsetWidth+3*(46+26), sc=Math.min(1,(innerWidth-16)/nat);
  r.style.transform=sc<1?`scale(${sc})`:'none'; r.style.transformOrigin='top center'; r.style.marginBottom=sc<1?`${-(1-sc)*135}px`:'0';
}
addEventListener('resize',fitRack); fitRack();
</script>
