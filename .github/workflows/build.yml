name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/Compressotchi_artefacts/Release/VST3/COMPRESSOTCHI.vst3" dist/
          Compress-Archive -Path dist/COMPRESSOTCHI.vst3 -DestinationPath COMPRESSOTCHI-Windows-VST3.zip

      - name: Collect (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R "build/Compressotchi_artefacts/Release/VST3/COMPRESSOTCHI.vst3" dist/
          cp -R "build/Compressotchi_artefacts/Release/AU/COMPRESSOTCHI.component" dist/
          cd dist && ditto -c -k --keepParent COMPRESSOTCHI.vst3 ../COMPRESSOTCHI-macOS-VST3.zip && ditto -c -k --keepParent COMPRESSOTCHI.component ../COMPRESSOTCHI-macOS-AU.zip

      - uses: actions/upload-artifact@v4
        with:
          name: COMPRESSOTCHI-${{ matrix.name }}
          path: COMPRESSOTCHI-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
